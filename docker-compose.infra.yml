# Local development: infrastructure services only
# Usage: cp .env.dev.example .env.dev && docker compose --env-file .env.dev -f docker-compose.infra.yml up -d
# Then run frontend (npm run dev :5173) and backend (mvn spring-boot:run :8080) natively.
# If you don't create .env.dev the defaults in .env.dev.example are used via variable substitution.

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: curio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curio_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.dev or your shell}
    # Bind to loopback only — dev infra must not be reachable from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.9-alpine
    container_name: curio-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru;
             else
               redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru;
             fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Bind to loopback only — dev infra must not be reachable from the LAN.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
