# TLS-terminating nginx config for the Cloudflare-proxied production origin.
#
# This variant is used ONLY in prod via docker-compose.cf-tls.yml, which mounts
# it over the image's default /etc/nginx/conf.d/default.conf together with a
# Cloudflare Origin Certificate. It is intentionally NOT the baked-in default
# (frontend/nginx.conf), because the ssl_certificate files below do not exist in
# local/dev builds and nginx would fail to start.
#
# Deployment model: browser --HTTPS--> Cloudflare --HTTPS(443)--> this nginx.
# With Cloudflare SSL mode "Full (strict)" the Cloudflare->origin hop is
# encrypted and validated against the Origin CA, closing the plaintext gap.
# Port 80 is retained only for the container healthcheck and MUST be firewalled
# to Cloudflare IP ranges at the security-group layer (Cloudflare never uses it
# once "Always Use HTTPS" + "Full (strict)" are set).

# Edge rate-limit zones (belt-and-braces with the backend Bucket4j filter).
limit_req_zone $binary_remote_addr zone=curio_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=curio_api:10m rate=30r/s;
limit_req_status 429;

# Reject unrealistically long request bodies before they reach the backend.
client_max_body_size 2m;
client_body_buffer_size 128k;
client_body_timeout 15s;
client_header_timeout 10s;

server {
    listen 80;
    # TLS on 443 with the Cloudflare Origin Certificate (mounted read-only).
    listen 443 ssl;
    http2 on;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # OPTIONAL hardening — Cloudflare Authenticated Origin Pulls (mTLS): reject
    # any 443 request that isn't carrying Cloudflare's client certificate, so the
    # origin only answers Cloudflare even if the firewall is misconfigured. To
    # enable: download Cloudflare's origin-pull CA to tls/cloudflare-origin-pull-ca.pem,
    # turn on Authenticated Origin Pulls in the Cloudflare dashboard, and uncomment:
    # ssl_client_certificate /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # Don't leak the nginx version in the Server header (fingerprinting aid).
    server_tokens off;

    # Security headers.
    #
    # GOTCHA: nginx `add_header` does NOT inherit into a `location` (or other
    # nested context) that defines ANY `add_header` of its own — the child
    # context REPLACES the whole set, silently dropping every header declared
    # here. The `= /index.html` and `/assets/` blocks below each add their own
    # Cache-Control, so they MUST re-emit this full security-header set or those
    # responses ship with no CSP / X-Frame-Options / Referrer-Policy / HSTS.
    # Keep the three blocks (this one + the two locations) in sync — AND in sync
    # with frontend/nginx.conf, the non-TLS default.
    #
    # CSP note: index.html loads the Google Identity script
    # (accounts.google.com/gsi/client), the Google Fonts stylesheet
    # (fonts.googleapis.com) and its font files (fonts.gstatic.com), so
    # script-src / style-src / font-src must allowlist those hosts or the app
    # renders unstyled and Google sign-in breaks.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # This location defines its own add_header, so it does NOT inherit the
        # server-level security headers — re-emit them (see the gotcha note above).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # index.html — never cache so browsers always get latest chunk references
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # This location defines its own add_header, so it does NOT inherit the
        # server-level security headers — re-emit them (see the gotcha note above).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block actuator from edge (health/info are reachable via /api/ if needed;
    # prometheus scraping should happen on the internal docker network, not the edge).
    location /actuator {
        deny all;
        return 404;
    }

    # Tighter rate limit specifically on auth endpoints.
    location /api/v1/auth/ {
        limit_req zone=curio_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Admin batch endpoints (digest gen, email send) iterate over all users
    # and serially hit the AI provider — they routinely take minutes. The
    # standard 60s timeout 504s the request mid-batch.
    location /api/v1/admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # Quiz generation can also take ~15s on a cold cache (Claude latency);
    # bump to a comfortable buffer.
    location /api/v1/quiz/digest/ {
        limit_req zone=curio_api burst=20 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy API requests to backend
    location /api/ {
        limit_req zone=curio_api burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
