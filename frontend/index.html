<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Managed by useTheme.ts (applyThemeColor): kept in sync with the paper
         tone actually shown, so it follows the in-app light/dark toggle — which
         can override the OS scheme — not just prefers-color-scheme. This static
         value is only the pre-JS first-paint fallback. -->
    <meta name="theme-color" content="#14130f" />
    <title>Curio — A daily for AI model news</title>
    <meta name="description" content="Curio is a free daily brief on AI model news — releases, agents and benchmarks in plain language, with a five-question quiz to make it stick. In English and Korean." />
    <link rel="canonical" href="https://curio-news.dev/" />

    <!-- Share previews (X, Slack, KakaoTalk, LinkedIn…). The app is client-rendered,
         so crawlers only ever see these static tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Curio" />
    <meta property="og:url" content="https://curio-news.dev/" />
    <meta property="og:title" content="Curio — A daily for AI model news" />
    <meta property="og:description" content="The AI beat, curated before coffee. A free five-minute brief on model releases, agents and benchmarks, every morning." />
    <meta property="og:image" content="https://curio-news.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Curio — The AI beat, curated before coffee." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Curio — A daily for AI model news" />
    <meta name="twitter:description" content="The AI beat, curated before coffee. A free five-minute brief on model releases, agents and benchmarks, every morning." />
    <meta name="twitter:image" content="https://curio-news.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="app"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
