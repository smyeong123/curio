# Edge rate-limit zones (belt-and-braces with the backend Bucket4j filter).
limit_req_zone $binary_remote_addr zone=curio_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=curio_api:10m rate=30r/s;
limit_req_status 429;

# Reject unrealistically long request bodies before they reach the backend.
client_max_body_size 2m;
client_body_buffer_size 128k;
client_body_timeout 15s;
client_header_timeout 10s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version in the Server header (fingerprinting aid).
    server_tokens off;

    # Resolve the backend through Docker's embedded DNS at request time instead
    # of once at startup. A literal backend host in proxy_pass is resolved only
    # when nginx boots, so after a backend restart/redeploy (new container IP)
    # every /api call 502s/504s until nginx itself restarts. A variable in
    # proxy_pass forces a runtime lookup (cached for `valid=10s`).
    # NOTE: with a variable, nginx does NOT do URI replacement — a proxy_pass
    # without a URI part forwards the original request URI unchanged (same as
    # before); one WITH a URI part (/healthz) sends exactly that URI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $curio_backend http://backend:8080;

    # Idle keep-alive towards the client (Cloudflare in prod). Must exceed
    # Cloudflare's own idle-connection reuse window, otherwise nginx closes a
    # connection Cloudflare is about to reuse and the edge answers 520/522.
    # Server-level (not http-level): the image's /etc/nginx/nginx.conf already
    # sets keepalive_timeout in http{}, so repeating it there is a duplicate.
    keepalive_timeout 650s;

    # Security headers.
    #
    # GOTCHA: nginx `add_header` does NOT inherit into a `location` (or other
    # nested context) that defines ANY `add_header` of its own — the child
    # context REPLACES the whole set, silently dropping every header declared
    # here. The `= /index.html` and `/assets/` blocks below each add their own
    # Cache-Control, so they MUST re-emit this full security-header set or those
    # responses ship with no CSP / X-Frame-Options / Referrer-Policy / HSTS.
    # Keep the four blocks (this one + the two locations) in sync.
    #
    # CSP note: index.html loads the Google Identity script
    # (accounts.google.com/gsi/client), the Google Fonts stylesheet
    # (fonts.googleapis.com) and its font files (fonts.gstatic.com), so
    # script-src / style-src / font-src must allowlist those hosts or the app
    # renders unstyled and Google sign-in breaks.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    # HSTS is emitted here only as a belt-and-braces signal; production should
    # terminate TLS upstream (see docker-compose.tls.yml + Caddyfile) and emit
    # Strict-Transport-Security from that layer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # This location defines its own add_header, so it does NOT inherit the
        # server-level security headers — re-emit them (see the gotcha note above).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # index.html — never cache so browsers always get latest chunk references
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # This location defines its own add_header, so it does NOT inherit the
        # server-level security headers — re-emit them (see the gotcha note above).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Static files (robots.txt, sitemap.xml, og-image.png, favicon…) are served
    # as-is; anything else that isn't a known SPA route is a real 404. The
    # error page is the SPA shell (its catch-all route renders "not found"),
    # but the status stays 404 so crawlers don't index soft 404s.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /index.html;

    # SPA routes — keep in sync with the top-level paths in src/router/index.ts.
    # Internal rewrite so the response goes through `= /index.html` (no-cache +
    # the full security-header set).
    location ~ ^/(login|register|reset-password|verify|verify-email|privacy|terms|contact|onboarding|dashboard|admin)(/|$) {
        rewrite ^ /index.html last;
    }

    # Public liveness probe for uptime monitors. Proxies only the backend's
    # health endpoint, so a 200 means nginx AND the backend are up. Credentials
    # are stripped so the response is always the anonymous {"status":"UP"}
    # (show-details is when-authorized). Exact match wins over the block below.
    location = /healthz {
        access_log off;
        proxy_pass $curio_backend/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Block actuator from edge (health/info are reachable via /api/ if needed;
    # prometheus scraping should happen on the internal docker network, not the edge).
    location /actuator {
        deny all;
        return 404;
    }

    # Tighter rate limit specifically on auth endpoints.
    location /api/v1/auth/ {
        limit_req zone=curio_auth burst=10 nodelay;
        proxy_pass $curio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Admin batch endpoints (digest gen, email send) iterate over all users
    # and serially hit the AI provider — they routinely take minutes. The
    # standard 60s timeout 504s the request mid-batch.
    location /api/v1/admin/ {
        proxy_pass $curio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # Quiz generation can also take ~15s on a cold cache (Claude latency);
    # bump to a comfortable buffer.
    location /api/v1/quiz/digest/ {
        limit_req zone=curio_api burst=20 nodelay;
        proxy_pass $curio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy API requests to backend
    location /api/ {
        limit_req zone=curio_api burst=60 nodelay;
        proxy_pass $curio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
