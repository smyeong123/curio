name: Bug report
description: Something isn't working as expected
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must not be filed here** — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth / login
        - Digest / news
        - Quiz
        - Email
        - Studio
        - Admin
        - Settings / preferences
        - Other
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - English
        - 한국어
        - Both
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS, or local dev / Docker / hosted.
      placeholder: Chrome 140, macOS 26 — local dev
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, cookies, email codes, and API keys before pasting.
      render: shell
