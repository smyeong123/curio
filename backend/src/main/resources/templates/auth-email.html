<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${lang}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title}">Curio</title>
</head>
<!-- The account-security shell (inverted strip, masthead, footer) with one of
     two bodies chosen by ${kind}: "reset" (password reset link) or "code"
     (sign-in verification code). All copy comes from messages*.properties in
     the Context's locale; the few sentences carrying <strong> use th:utext on
     purpose — they are our own catalog strings, never user input. Keep the
     palette in step with digest-email.html. -->
<body style="margin:0; padding:0; background-color:#e7ddc9; color:#14130f; font-family:'Helvetica Neue', Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;" th:text="${preheader}"></div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#e7ddc9; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#f3ede1; border:1px solid #14130f;">

          <!-- Metadata strip (inverted bar) -->
          <tr>
            <td style="background-color:#14130f; padding:10px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#f3ede1;" th:text="#{auth.email.strip}">Curio · Account Security</td>
                  <td align="right" style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#ff7a52;" th:text="${badge}">Badge</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Masthead -->
          <tr>
            <td style="padding:32px 28px 20px 28px; border-bottom:1px solid #14130f;">
              <div style="font-family:Georgia, 'Times New Roman', 'Apple Myungjo', 'Batang', serif; font-size:40px; line-height:1; font-weight:600; color:#14130f; letter-spacing:-1px;">Curio</div>
              <div style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#6e695b; margin-top:8px;" th:text="#{auth.email.masthead.tagline}">— A daily for AI model news</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px 28px;">

              <th:block th:if="${kind == 'reset'}">
                <div style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#c4290a; margin-bottom:14px;" th:text="#{auth.email.reset.kicker}">Password reset</div>
                <h1 style="margin:0 0 16px 0; font-family:Georgia, 'Times New Roman', 'Apple Myungjo', 'Batang', serif; font-size:28px; line-height:1.15; font-weight:600; color:#14130f;" th:text="#{auth.email.reset.title}">Reset your password</h1>
                <p style="margin:0 0 24px 0; font-size:15px; line-height:1.65; color:#2c2a23;" th:utext="#{auth.email.reset.body}">Body</p>

                <!-- A real link, so the click works in every mail client. -->
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 28px 0;">
                  <tr>
                    <td style="background-color:#14130f;">
                      <a th:href="${link}" style="display:inline-block; padding:14px 28px; font-family:'Courier New', monospace; font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#f3ede1; text-decoration:none; border:1px solid #14130f;" th:text="#{auth.email.reset.button}">Reset password →</a>
                    </td>
                  </tr>
                </table>

                <p style="margin:0 0 6px 0; font-size:13px; line-height:1.6; color:#6e695b;" th:text="#{auth.email.reset.paste}">Button not working? Paste this link into your browser:</p>
                <p style="margin:0 0 28px 0; font-size:12px; line-height:1.5; word-break:break-all;">
                  <a th:href="${link}" th:text="${link}" style="color:#c4290a; text-decoration:underline;">link</a>
                </p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:14px 16px; background-color:#ece4d2; border-left:3px solid #ff4a1c;">
                      <p style="margin:0; font-size:13px; line-height:1.55; color:#2c2a23;" th:text="#{auth.email.reset.note}">Note</p>
                    </td>
                  </tr>
                </table>
              </th:block>

              <th:block th:if="${kind == 'code'}">
                <div style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#c4290a; margin-bottom:14px;" th:text="#{auth.email.code.kicker}">Sign-in verification</div>
                <h1 style="margin:0 0 16px 0; font-family:Georgia, 'Times New Roman', 'Apple Myungjo', 'Batang', serif; font-size:28px; line-height:1.15; font-weight:600; color:#14130f;" th:text="#{auth.email.code.title}">Here's your code</h1>
                <p style="margin:0 0 24px 0; font-size:15px; line-height:1.65; color:#2c2a23;" th:utext="#{auth.email.code.body(${ttl})}">Body</p>

                <!-- Code block -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 12px 0;">
                  <tr>
                    <td align="center" style="background-color:#14130f; padding:22px 16px;">
                      <div id="curio-code" style="font-family:'Courier New', monospace; font-size:38px; font-weight:700; letter-spacing:12px; color:#f3ede1; padding-left:12px;" th:text="${code}">000000</div>
                    </td>
                  </tr>
                </table>

                <!-- Email clients strip JS, so an in-message copy is impossible; this
                     opens Curio with the code pre-filled. The raw code stays selectable
                     above for anyone who'd rather copy it by hand. -->
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px 0;">
                  <tr>
                    <td style="border:1px solid #14130f; background-color:#f3ede1;">
                      <a th:href="${verifyLink}" target="_blank" style="display:inline-block; padding:11px 24px; font-family:'Courier New', monospace; font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#14130f; text-decoration:none;" th:text="#{auth.email.code.button}">Copy code →</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 28px 0; font-size:12px; line-height:1.5; color:#6e695b;" th:text="#{auth.email.code.hint}">Hint</p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:14px 16px; background-color:#ece4d2; border-left:3px solid #ff4a1c;">
                      <p style="margin:0; font-size:13px; line-height:1.55; color:#2c2a23;" th:text="#{auth.email.code.note}">Note</p>
                    </td>
                  </tr>
                </table>
              </th:block>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 28px; border-top:1px solid #14130f; background-color:#f3ede1;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#6e695b;" th:text="#{auth.email.footer.copyright}">© 2026 Curio</td>
                  <td align="right" style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#6e695b;" th:text="#{auth.email.footer.tagline}">Stay curious</td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
