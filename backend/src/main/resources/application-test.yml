spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-minimum-256-bits-for-hs256-algorithm-testing
  refresh-secret: test-refresh-secret-key-minimum-256-bits-testing
  expiration: 900000
  refresh-expiration: 604800000

auth:
  # Tests mock the auth service and run without the verification-codes table,
  # so keep the one-time-code step off here.
  email-verification:
    enabled: false

ai:
  provider: claude

claude:
  api-key: test-key
  model: claude-sonnet-4-6
  api-url: https://api.anthropic.com/v1/messages

resend:
  api-key: test-resend-key
  from-email: test@curio.news
  webhook-secret: whsec_dGVzdC13ZWJob29rLXNlY3JldA==
  webhook-tolerance-seconds: 300

app:
  frontend-url: http://localhost:5173
  backend-url: http://localhost:8080
  cors-allowed-origins: http://localhost:5173
  unsubscribe-secret: test-unsubscribe-secret
  unsubscribe-token-ttl-hours: 720
