spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  flyway:
    # Prod schema is established and managed by Flyway from V1 onward. Never
    # baseline here: on a restored/populated DB missing flyway_schema_history,
    # baseline-on-migrate would adopt the current state and silently skip
    # pending migrations. Fail loudly instead so schema drift is caught.
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  expiration: 900000        # 15 minutes (access token)
  # Overall session length (sliding: rotation resets this on each refresh, so it is
  # an idle timeout). Override JWT_REFRESH_EXPIRATION (ms) without a rebuild.
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:10800000}  # 3 hours

claude:
  api-key: ${CLAUDE_API_KEY}
  model: ${CLAUDE_MODEL:claude-sonnet-4-6}
  api-url: https://api.anthropic.com/v1/messages

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${FROM_EMAIL:digest@curio-news.dev}
  webhook-secret: ${RESEND_WEBHOOK_SECRET}
  webhook-tolerance-seconds: ${RESEND_WEBHOOK_TOLERANCE_SECONDS:300}

ai:
  provider: ${AI_PROVIDER:claude}

gemini:
  api-key: ${GEMINI_API_KEY:}
  api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

openai:
  api-key: ${OPENAI_API_KEY:}
  api-url: https://api.openai.com/v1/chat/completions
  model: ${OPENAI_MODEL:gpt-4o-mini}

news:
  api-key: ${NEWS_API_KEY}

app:
  # Google OAuth client id — used ONLY to validate the Google ID token's `aud`
  # claim in AuthService (tokeninfo flow; no server-side oauth2Login). Empty →
  # Google login is off (DEPLOY.md Phase 0); email/password auth unaffected.
  google-client-id: ${GOOGLE_CLIENT_ID:}
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}
  cors-allowed-origins: ${FRONTEND_URL}
  unsubscribe-secret: ${UNSUBSCRIBE_SECRET}
  unsubscribe-token-ttl-hours: ${UNSUBSCRIBE_TOKEN_TTL_HOURS:720}
  # AES-256-GCM master key for at-rest BYOK encryption.
  # REQUIRED in prod (no default). Generate: openssl rand -base64 32.
  api-key-encryption-key: ${API_KEY_ENCRYPTION_KEY}
  cookie:
    secure: true

springdoc:
  # Disable BOTH the UI and the raw OpenAPI JSON in prod. Leaving api-docs on
  # (even with the UI off) publishes the full endpoint/DTO schema to anyone,
  # an information-disclosure aid for attackers enumerating the API.
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

spring.jpa.show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: curio

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:prod}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

logging:
  level:
    com.curio: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n"
