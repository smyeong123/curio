# Account-security emails (auth-email.html). Keys WITH {n} arguments: escape apostrophes as ''.
auth.email.strip=Curio · Account Security
auth.email.masthead.tagline=— A daily for AI model news
auth.email.footer.copyright=© 2026 Curio
auth.email.footer.tagline=Stay curious
auth.email.reset.subject=Reset your Curio password
auth.email.reset.preheader=Reset your Curio password — this link expires in 1 hour.
auth.email.reset.badge=Action required
auth.email.reset.kicker=Password reset
auth.email.reset.title=Reset your password
auth.email.reset.body=We received a request to reset the password for your Curio account. Click the button below to choose a new one. This link expires in <strong>1 hour</strong>.
auth.email.reset.button=Reset password →
auth.email.reset.paste=Button not working? Paste this link into your browser:
auth.email.reset.note=Didn't request this? You can safely ignore this email — your password won't change unless you open the link above.
auth.email.code.subject=Your Curio sign-in code: {0}
auth.email.code.preheader=Your Curio sign-in code is {0} — it expires in {1} minutes.
auth.email.code.badge=Verify it's you
auth.email.code.kicker=Sign-in verification
auth.email.code.title=Here's your code
auth.email.code.body=Enter this code to finish signing in to your Curio account. It expires in <strong>{0} minutes</strong>.
auth.email.code.button=Copy code →
auth.email.code.hint=Opens Curio with your code filled in. Or tap and hold the code above to copy it.
auth.email.code.note=Never share this code. Curio will never ask you for it. Didn't try to sign in? You can safely ignore this email — and consider changing your password.
